<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Closures</h2>

<p>Counting with a local variable.</p>

<button type="button" onclick="myFunction()">Increment</button>
<button type="button" onclick="myFunctionn()">Decrement</button>
<button type="button" onclick="myFunction2()">Add By 2</button>
<button type="button" onclick="myFunction3()">Dec By 2</button>

<p id="demo">0</p>

<script>
const add = (function () {
  let counter = 0;
  return function () {counter += 1; return counter;}
})();

const sub = (function () {
  let counter = 0;
  return function () {counter -= 1; return counter;}
})();

const addByTwo = (function () {
  let counter = 0;
  return function () {counter += 2; return counter;}
})();

const subByTwo=(function (){
	let counter =0;
    return function() {counter -=2; return counter;}
    })();

function myFunction() {
  document.getElementById("demo").innerHTML = add();
}

function myFunctionn() {
  document.getElementById("demo").innerHTML = sub();
}

function myFunction2() {
  document.getElementById("demo").innerHTML = addByTwo();
}

function myFunction3(){
document.getElementById("demo").innerHTML =subByTwo();
}
</script>

</body>
</html>
